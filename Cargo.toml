[package]
name = "cursed_arithmetic"
version = "0.1.0"
edition = "2024"
description = "Integer and bignum arithmetic built from lookup tables, not primitive arithmetic"
readme = "README.md"
keywords = ["arbitrary-precision", "bignum", "arithmetic", "cursed"]
categories = ["mathematics"]

[dependencies]

[dev-dependencies]
criterion = "0.7"
num-bigint = "0.4"

[features]
default = ["simd"]
simd = []

[[bench]]
name = "vs_num_bigint"
harness = false
